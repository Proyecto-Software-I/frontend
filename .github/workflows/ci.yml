name: Frontend CI

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenSpec CLI
        run: npm install --global @fission-ai/openspec@1.9.0

      - name: Validate OpenSpec
        run: npm run spec:validate

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build
